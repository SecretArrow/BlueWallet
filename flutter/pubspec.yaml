name: octopus_wallet
description: "Octopus Wallet - Secure crypto wallet for the Octra blockchain"
publish_to: 'none'

version: 0.18.0-alpha+312

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  crypto: ^3.0.3
  convert: ^3.1.1
  path_provider: ^2.1.4
  intl: ^0.19.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  file_picker: ^8.1.6
  go_router: ^14.6.3
  flutter_svg: ^2.0.10+1
  package_info_plus: ^8.1.2
  # Crypto operations — ed25519 (NaCl-compatible) for key gen/signing
  # (removed: cryptography package no longer needed — all ops use liboctra_native.so)
  # SQLite for persistent tx history and token snapshots
  sqflite: ^2.3.3+1
  path: ^1.9.0
  # FFI bindings to the native C++ crypto library (liboctra_native.so)
  ffi: ^2.1.0
  sqflite_common_ffi: ^2.3.4+4
  local_auth: ^2.3.0
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo_app_octopus.png
    - assets/webcli/
    - assets/webcli/icons/
    - assets/webcli/templates/
    - assets/webcli/adapter/
