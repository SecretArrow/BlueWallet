name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      android: ${{ steps.filter.outputs.android }}
      webcli: ${{ steps.filter.outputs.webcli }}
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            flutter:
              - 'flutter/**'
            android:
              - 'android-native/**'
            webcli:
              - 'webcli/**'
              - '.gitmodules'
            sdk:
              - 'sdk/**'
              # Version bumps must re-run the sdk guards: sdk/test/version.test.mjs
              # asserts both apps agree AND that we have not shipped past the
              # v0.19.0 legacy-dialect sunset — without these paths a
              # version-bump-only PR skips that guard entirely.
              - 'android-native/version.properties'
              - 'flutter/pubspec.yaml'

  lint-workflows:
    # Static-check every workflow file with actionlint. Fully parallel: not
    # part of any needs chain so it never delays or gates the build jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # actionlint only reads .github/workflows — no submodules, shallow.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install actionlint 1.7.7
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar -xz -C /usr/local/bin actionlint
      - name: Run actionlint
        run: actionlint -color

  flutter:
    needs: changes
    if: needs.changes.outputs.flutter == 'true' || needs.changes.outputs.webcli == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Pinned JDK + gradle user-home cache: `flutter build apk` runs a real
      # gradle build under the hood (sdk gradle wrapper), and setup-gradle
      # caches ~/.gradle for it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage --timeout 90s
      # Coverage summary (Fase 4 gate input, report-only).
      - name: Coverage summary
        if: always()
        run: python3 ../.github/scripts/coverage_report.py --lcov coverage/lcov.info --label "Flutter coverage" >> "$GITHUB_STEP_SUMMARY"
      # Validates the Android embedding + native (FFI/PVAC) compilation.
      - run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-debug-apk
          path: flutter/build/app/outputs/flutter-apk/*.apk

  android-quick:
    needs: changes
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.webcli == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Fast checks only: no assembleDebug here (see android-build).
      # spotlessCheck is ratcheted to origin/main — only changed lines.
      # jacocoTestReport feeds the Fase 4 coverage gate (report-only).
      - run: bash gradlew --no-daemon lintDebug testDebugUnitTest :app:spotlessCheck :app:jacocoTestReport
      # Coverage summary (Fase 4 gate input, report-only).
      - name: Coverage summary
        if: always()
        run: python3 ../.github/scripts/coverage_report.py --jacoco app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml --label "Android coverage" >> "$GITHUB_STEP_SUMMARY"
      # Always print every lint error (the console shows only the first).
      - name: Dump all lint errors
        if: always()
        run: |
          f=app/build/reports/lint-results-debug.xml
          if [ -f "$f" ]; then
            python3 -c "
          import xml.etree.ElementTree as ET, sys
          t = ET.parse('$f')
          n = 0
          for issue in t.getroot().iter('issue'):
              if issue.get('severity') != 'Error':
                  continue
              n += 1
              loc = issue.find('location')
              print(f\"{loc.get('file','?')}:{loc.get('line','?')}: [{issue.get('id')}] {issue.get('message','')[:200]}\")
          print(f'TOTAL lint errors: {n}')
          "
          else
            echo "no lint report found"
          fi

  android-build:
    needs: changes
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.webcli == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # NDK downloads from dl.google.com have flaked with corrupt zips
      # ("Error on ZipFile unknown archive") making CI red on trunk — pre-
      # install with retries before gradle touches it.
      - name: Pre-install NDK (retry flaky downloads)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          NDK_VERSION="27.0.12077973"
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$ANDROID_ROOT/ndk/$NDK_VERSION" ] && [ -x "$ANDROID_ROOT/ndk/$NDK_VERSION/ndk-build" ]; then
            echo "NDK $NDK_VERSION already present"
            exit 0
          fi
          # `sdkmanager` is not reliably on PATH across runner images —
          # resolve the absolute binary (latest layout, then legacy).
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for cand in \
              "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROID_ROOT/cmdline-tools/bin/sdkmanager" \
              "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
              if [ -x "$cand" ]; then SDKMANAGER="$cand"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            # No sdkmanager on this image: leave the install to gradle's own
            # downloader instead of hard-failing here (the original flake).
            echo "::warning::sdkmanager not found — NDK left to gradle auto-install"
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "NDK install attempt $attempt"
            # `yes` dies with SIGPIPE (141) once sdkmanager stops reading; under
            # `set -o pipefail` that would mask a successful install, so relax
            # -e/pipefail for this one pipeline and test sdkmanager's own status.
            set +e
            set +o pipefail
            yes | "$SDKMANAGER" "ndk;$NDK_VERSION" > /tmp/ndk-install.log 2>&1
            rc=$?
            set -e
            set -o pipefail
            if [ "$rc" -eq 0 ]; then
              echo "NDK installed on attempt $attempt"
              exit 0
            fi
            echo "::warning::NDK install attempt $attempt failed (see /tmp/ndk-install.log tail)"
            tail -n 40 /tmp/ndk-install.log || true
            sleep $((attempt * 20))
          done
          echo "::error::NDK $NDK_VERSION failed to install after 3 attempts"
          exit 1
      - run: bash gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android-native/app/build/outputs/apk/debug/*.apk

  sdk:
    needs: changes
    if: needs.changes.outputs.sdk == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      # Zero runtime dependencies: install only validates the manifest.
      - run: npm ci --ignore-scripts
      - run: npm test

  size-report:
    needs: [flutter, android-build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-debug-apk'
          merge-multiple: true
          path: apks
      - name: APK size report
        run: |
          {
            echo "## APK size report (debug)"
            echo ""
            echo "| APK | Size | Top entries |"
            echo "| --- | --- | --- |"
            for f in apks/*.apk; do
              [ -e "$f" ] || continue
              size=$(du -h "$f" | cut -f1)
              top=$(unzip -l "$f" | sort -k4 -n | tail -5 | awk '{print $4 " (" $1 ")"}' | paste -sd '<br>' -)
              echo "| $(basename "$f") | $size | $top |"
            done
            echo ""
            echo "### webcli assets bundled"
            for f in apks/*.apk; do
              [ -e "$f" ] || continue
              echo ""
              echo "**$(basename "$f")**:"
              echo '```'
              unzip -l "$f" | grep -i 'webcli/' | awk '{print $4}' || echo "(none)"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

  autofix-flutter:
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 15
    # Fork PRs can never push back to the base repo — hard-fail on checkout
    # of a head ref that lives in the fork — so only run for same-repo PRs.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.flutter == 'true'
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart fix --apply
      - run: dart format lib test integration_test
      - name: Commit fixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-fix lint and format"
            git push
          fi

  autofix-java:
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 15
    # Fork PRs can never push back to the base repo — hard-fail on checkout
    # of a head ref that lives in the fork — so only run for same-repo PRs.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.android == 'true'
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew --no-daemon :app:spotlessApply
      - name: Commit fixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-fix java format (spotless)"
            git push
          fi
