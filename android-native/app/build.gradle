plugins {
    id 'com.android.application'
}
apply plugin: 'com.diffplug.spotless'

// Auto-format for CI autofix: google-java-format, enforced only on lines
// changed vs main (ratchet) so history isn't reformatted in one giant diff.
spotless {
    java {
        googleJavaFormat()
        ratchetFrom 'origin/main'
    }
}

import javax.imageio.ImageIO
import java.awt.RenderingHints
import java.awt.image.BufferedImage

def appLogoSource = rootProject.file("logo-app-octra.png")
def appLogoTarget = file("src/main/res/drawable/logo_app_octopus.png")
def legacyResLogo = file("src/main/res/drawable/logo-app-octra.png")
def launcherSizes = [
        "mdpi" : 48,
        "hdpi" : 72,
        "xhdpi": 96,
        "xxhdpi": 144,
        "xxxhdpi": 192
]
def launcherScale = 0.72d

tasks.register("prepareAppLogo", Copy) {
    onlyIf { appLogoSource.exists() }
    from(appLogoSource)
    into(appLogoTarget.parentFile)
    rename { appLogoTarget.name }
}

tasks.register("migrateLegacyResLogo") {
    doLast {
        if (!legacyResLogo.exists()) {
            return
        }

        if (!appLogoSource.exists()) {
            copy {
                from(legacyResLogo)
                into(rootProject.projectDir)
                rename { "logo-app-octra.png" }
            }
        }

        delete(legacyResLogo)
    }
}

tasks.register("generateLauncherPngs") {
    onlyIf { appLogoSource.exists() }
    doLast {
        BufferedImage src = ImageIO.read(appLogoSource)
        if (src == null) {
            throw new RuntimeException("Invalid image file: ${appLogoSource}")
        }

        launcherSizes.each { density, size ->
            File mipmapDir = file("src/main/res/mipmap-${density}")
            if (!mipmapDir.exists()) {
                mipmapDir.mkdirs()
            }

            BufferedImage resized = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB)
            def graphics = resized.createGraphics()
            graphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC)
            graphics.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY)
            graphics.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
            int targetSize = Math.max(1, (int) Math.round(size * launcherScale))
            int offset = (size - targetSize) / 2
            graphics.drawImage(src, offset, offset, targetSize, targetSize, null)
            graphics.dispose()

            ImageIO.write(resized, "png", new File(mipmapDir, "ic_launcher.png"))
            ImageIO.write(resized, "png", new File(mipmapDir, "ic_launcher_round.png"))
        }
    }
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn("migrateLegacyResLogo")
    dependsOn("prepareAppLogo")
    dependsOn("generateLauncherPngs")
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def versionPropertiesFile = rootProject.file("version.properties")
def versionProperties = new Properties()
if (versionPropertiesFile.exists()) {
    versionProperties.load(new FileInputStream(versionPropertiesFile))
} else {
    versionProperties.setProperty("VERSION_CODE", "1")
    versionProperties.setProperty("VERSION_NAME", "0.14.1-alpha")
    versionPropertiesFile.withOutputStream { out -> versionProperties.store(out, null) }
}

def configuredVersionCode = (versionProperties.getProperty("VERSION_CODE", "1") as int)
def configuredVersionName = versionProperties.getProperty("VERSION_NAME", "0.14.1-alpha")
def shouldAutoIncrementVersion = gradle.startParameter.taskNames.any { task ->
    String lower = task == null ? "" : task.toLowerCase()
    return lower.contains("assemble") || lower.contains("bundle") || lower.contains("install")
}
def effectiveVersionCode = configuredVersionCode
if (shouldAutoIncrementVersion) {
    effectiveVersionCode = configuredVersionCode + 1
    versionProperties.setProperty("VERSION_CODE", String.valueOf(effectiveVersionCode))
    versionPropertiesFile.withOutputStream { out -> versionProperties.store(out, null) }
}

def resolveSigningAlias(File keystoreFile, String storePassword, String configuredAlias) {
    if (configuredAlias != null && !configuredAlias.trim().isEmpty()) {
        return configuredAlias
    }
    if (keystoreFile == null || !keystoreFile.exists() || storePassword == null || storePassword.isEmpty()) {
        return null
    }
    def keyStore = java.security.KeyStore.getInstance(java.security.KeyStore.getDefaultType())
    keystoreFile.withInputStream { stream ->
        keyStore.load(stream, storePassword.toCharArray())
    }
    def aliases = keyStore.aliases()
    return aliases.hasMoreElements() ? aliases.nextElement() : null
}

android {
    namespace 'com.octopus.wallet'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.0.12077973'

    sourceSets {
        main {
            res {
                exclude 'drawable/logo-app-octra.png'
            }
        }
    }

    defaultConfig {
        applicationId "com.octopus.wallet"
        minSdk 28
        targetSdk 35
        versionCode effectiveVersionCode
        versionName "0.14.${effectiveVersionCode}-alpha"

        // APK size: strip locales bundled by AppCompat/Material/CameraX/Work.
        resConfigs "en"

        externalNativeBuild {
            cmake {
                // -Oz + LTO + section GC for the smallest native lib.
                // JNI entry points stay exported via JNIEXPORT (default visibility).
                cppFlags "-std=c++17 -Oz -fPIC -ffunction-sections -fdata-sections -flto=thin -fvisibility=hidden"
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        ndk {
            // When split-ABI is active the splits.abi block already restricts which
            // ABIs are compiled.  Setting abiFilters at the same time causes AGP to
            // throw "Conflicting configuration", so we only set it for the
            // non-split (fat / single-ABI) case.
            if (project.hasProperty('abiFilters')) {
                abiFilters project.property('abiFilters').split(',')
            } else if (!(project.hasProperty('splitAbi') && project.property('splitAbi').toBoolean())) {
                abiFilters 'arm64-v8a'
            }
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists() &&
                keystoreProperties.containsKey('storeFile') &&
                keystoreProperties.containsKey('storePassword')) {
                def configuredStoreFile = file(keystoreProperties['storeFile'])
                def configuredStorePassword = keystoreProperties['storePassword']
                def configuredAlias = resolveSigningAlias(
                        configuredStoreFile,
                        configuredStorePassword,
                        keystoreProperties.getProperty('keyAlias', '')
                )
                def configuredKeyPassword = keystoreProperties.getProperty('keyPassword', configuredStorePassword)

                if (configuredStoreFile.exists() && configuredAlias != null && !configuredAlias.isEmpty()) {
                    storeFile configuredStoreFile
                    storePassword configuredStorePassword
                    keyAlias configuredAlias
                    keyPassword configuredKeyPassword
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
            jniDebuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libsqlcipher.so'
        pickFirst '**/libsqlite3x.so'
    }

    splits {
        abi {
            enable project.hasProperty('splitAbi') ? project.property('splitAbi').toBoolean() : false
            reset()
            // armeabi-v7a (32-bit ARM) is excluded: the pvac crypto library requires
            // unsigned __int128 and hardware AES, neither of which are available on
            // 32-bit ARM targets.
            // APK size: release artifacts ship arm64-v8a only (native libs are
            // duplicated per ABI). Debug keeps x86_64 for the emulator;
            // use -PabiFilters=x86_64 explicitly if you need it.
            def requestedTasks = gradle.startParameter.taskNames.collect { it == null ? "" : it.toLowerCase() }
            def isReleaseBuild = requestedTasks.any { it.contains("assemblerelease") || it.contains("bundlerelease") }
            if (isReleaseBuild) {
                include 'arm64-v8a'
            } else {
                include 'arm64-v8a', 'x86_64'
            }
            universalApk false
        }
    }
}

// APK size: drop the webcli contract-IDE files (index.html, wallet.js,
// templates/) from release assets. swap/bridge/circles pages stay for the
// dApp bridge; the local server falls back gracefully (404 JSON) elsewhere.
androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        variant.packaging.resources.excludes.add("webcli/index.html")
        variant.packaging.resources.excludes.add("webcli/wallet.js")
        variant.packaging.resources.excludes.add("webcli/templates/**")
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // NOTE: constraintlayout/gridlayout removed — no layout uses them.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // NOTE: bcprov removed — Ed25519/X25519 live in the native TweetNaCl layer.
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    // Biometric authentication
    implementation 'androidx.biometric:biometric:1.1.0'
    // WorkManager for periodic background tasks
    implementation 'androidx.work:work-runtime:2.9.0'
    // ViewModel + LiveData (MVVM foundation)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    // Room database for local cache
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    // SQLCipher-backed Room encryption (database at-rest encryption)
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4@aar'
    implementation 'androidx.sqlite:sqlite:2.4.0'
    implementation 'androidx.sqlite:sqlite-framework:2.4.0'
    // NanoHTTPD — embedded HTTP server for LocalWebServer feature
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
